<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacotes | b2p</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/b2p/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>

  <nav class="sidebar">
    <a class="nav-item" href="/" title="Início">🏠</a>
    <a class="nav-item active" href="/packages/" title="Pacotes">📦</a>
    <a class="nav-item" href="/bundles/" title="Bundles">🎒</a>
    <a class="nav-item" href="/categories/" title="Categorias">🗂️</a>
    <a class="nav-item" href="/tags/" title="Tags">🏷️</a>
    <a class="nav-item" href="/my-b2p/" title="Meu b2p">⚡</a>
  </nav>

  <main class="content">
    <header class="content-header">
      <h1>b2p Packages</h1>
      <input type="text" class="input-technical" placeholder="Buscar na Power Store...">
    </header>

    <div class="grid-system">
      <div class="card-technical">
        <a href="/package/?json-fmt" class="card-header-link">
          <div class="icon-box">📄</div>
          <div class="card-title">
            <h3>JSON Formatter</h3>
            <p>Pretty-print para terminais.</p>
          </div>
        </a>
        <button class="btn-power">Instalar</button>
      </div>

      <div class="card-technical">
        <a href="/package/?port-scan" class="card-header-link">
          <div class="icon-box">🔍</div>
          <div class="card-title">
            <h3>Net-Scanner</h3>
            <p>Diagnóstico de rede local.</p>
          </div>
        </a>
        <button class="btn-power">Instalar</button>
      </div>

      <div class="card-technical">
        <a href="/package/?git-graph" class="card-header-link">
          <div class="icon-box">🌳</div>
          <div class="card-title">
            <h3>Git Graph CLI</h3>
            <p>Visualização de commits em árvore.</p>
          </div>
        </a>
        <button class="btn-power">Instalar</button>
      </div>
    </div>

  </main>

</body>
</html>
